name: "Bug Report"
description: "Report a bug or unexpected behavior in MultiStudio."
title: "[Bug]: "
labels:
  - bug

body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve MultiStudio!

        Please complete the form below with as much detail as possible.

        Before submitting:
        - Check whether the issue has already been reported.
        - Make sure you are using the latest available version.
        - Do not include passwords, stream keys, or access tokens.

        **Security vulnerabilities must not be reported here.**
        Please follow the instructions in SECURITY.md.

  - type: input
    id: version
    attributes:
      label: "MultiStudio Version"
      description: "Which version of MultiStudio are you using?"
      placeholder: "e.g. 0.1.0"
    validations:
      required: true

  - type: dropdown
    id: operating-system
    attributes:
      label: "Operating System"
      description: "Which operating system are you using?"
      options:
        - "Windows 11"
        - "Windows 10"
        - "Linux"
        - "macOS"
        - "Other"
    validations:
      required: true

  - type: dropdown
    id: affected-component
    attributes:
      label: "Affected Component"
      description: "Which part of MultiStudio is affected?"
      options:
        - "Application Startup"
        - "User Interface (Qt/QML)"
        - "Scenes"
        - "Sources"
        - "Preview"
        - "Audio Mixer"
        - "Streaming"
        - "Multistreaming"
        - "Recording"
        - "Encoder (FFmpeg)"
        - "Settings"
        - "Benchmark"
        - "Translations"
        - "Build System (CMake)"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: bug-description
    attributes:
      label: "Bug Description"
      description: "Describe the problem clearly."
      placeholder: "Explain what went wrong..."
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: "Steps to Reproduce"
      description: "Provide the steps needed to reproduce the bug."
      placeholder: |
        1. Open MultiStudio
        2. Navigate to...
        3. Click...
        4. Observe the error
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: "Expected Behavior"
      description: "What did you expect to happen?"
      placeholder: "Describe the expected result..."
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: "Actual Behavior"
      description: "What actually happened?"
      placeholder: "Describe what happened instead..."
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: "Frequency"
      description: "How often does this problem occur?"
      options:
        - "Always"
        - "Often"
        - "Sometimes"
        - "Rarely"
        - "Only once"
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: "Impact"
      description: "How much does this bug affect your use of MultiStudio?"
      options:
        - "Critical - Application is unusable"
        - "High - Major functionality is broken"
        - "Medium - Feature works incorrectly"
        - "Low - Minor or visual issue"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: "Logs and Error Messages"
      description: |
        Paste relevant logs or error messages.

        Remove sensitive information before submitting.
      render: shell
      placeholder: "Paste logs here..."
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: "Screenshots or Videos"
      description: "Attach screenshots or recordings if they help explain the issue."
      placeholder: "Drag and drop files here..."
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: "Additional Context"
      description: "Add any other information that may help reproduce or fix the issue."
      placeholder: "Hardware details, encoder settings, related issues..."
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: "Checklist"
      description: "Please confirm the following before submitting."
      options:
        - label: "I have searched for existing issues."
          required: true

        - label: "I have provided clear steps to reproduce the problem."
          required: true

        - label: "I have removed sensitive information from my report."
          required: true

        - label: "This report does not contain a security vulnerability."
          required: true
